<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doity</title>

    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/global.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background-color);
            padding: 20px;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1,
        h2 {
            color: var(--darker-font);
            font-weight: 600;
        }

        h1 {
            font-size: var(--title-size);
        }

        h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .links a {
            display: block;
            padding: 12px 0;
            border-radius: 8px;
            text-decoration: none;
            background: var(--brand-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .links a:hover {
            background: #d02229;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 20px;
            }

            h2 {
                font-size: 18px;
            }

            .links a {
                font-size: 14px;
                padding: 10px 0;
            }
        }

        @media (min-width: 1200px) {
            .container {
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Doity</h1>
        <h2>Pesquisa de Satisfação</h2>

        <ul class="links">
            <li><a href="create.html">Criar</a></li>
            <li><a href="edit.html">Editar</a></li>
            <li><a href="survey.html">Evento</a></li>
            <li><a href="results.html">Resultado</a></li>
            <li><a href="preview.html">Preview</a></li>
        </ul>
    </main>
</body>

</html>
